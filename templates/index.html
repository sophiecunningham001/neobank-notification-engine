<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Bank Credit Union</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">N</div>
          <div>
            <strong>Neon Bank</strong>
            <small>Credit Union</small>
          </div>
        </div>

        <nav>
          <button class="nav active">Overview</button>
          <button class="nav">Accounts</button>
          <button class="nav">Transfers</button>
          <button class="nav">Cards</button>
          <button class="nav">Fraud</button>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <h1>Dashboard</h1>
            <small>Member overview</small>
          </div>
          <div class="topbar-actions">
            <button class="btn secondary" id="logoutBtn">Logout</button>
          </div>
        </header>

        <section class="login-panel" id="loginPanel">
          <div class="card auth-card">
            <h2>Welcome back</h2>
            <input id="emailInput" type="email" value="sandbox@example.test" placeholder="Email" />
            <input id="passwordInput" type="password" value="ChangeMe123!" placeholder="Password" />
            <button id="loginBtn" class="btn primary">Sign in</button>
            <p id="loginStatus" class="status-text"></p>
          </div>
        </section>

        <section id="memberView" hidden>
          <div class="stats-grid">
            <div class="card stat">
              <span>Total balance</span>
              <strong id="totalBalance">$0.00</strong>
              <small id="balanceTrend">+2.4% this month</small>
            </div>
            <div class="card stat">
              <span>Available</span>
              <strong id="availableBalance">$0.00</strong>
              <small>Cash available</small>
            </div>
            <div class="card stat">
              <span>Risk</span>
              <strong class="good">Low</strong>
              <small>14 / 100</small>
            </div>
            <div class="card stat">
              <span>Cards</span>
              <strong id="cardCount">0</strong>
              <small>Primary + backup</small>
            </div>
          </div>

          <div class="content-grid">
            <div class="card">
              <div class="card-header">
                <h3>Accounts</h3>
              </div>
              <div id="accountsList"></div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3>Payment authorization</h3>
              </div>
              <form id="paymentForm">
                <input id="merchantInput" type="text" value="Test Coffee Co" placeholder="Merchant" />
                <input id="amountInput" type="number" value="2599" placeholder="Amount in cents" />
                <input id="panInput" type="text" value="4111111111111111" placeholder="Card PAN" />
                <button class="btn primary" type="submit">Authorize</button>
              </form>
              <p id="paymentStatus" class="status-text"></p>
            </div>
          </div>

          <div class="content-grid lower-grid">
            <div class="card">
              <div class="card-header">
                <h3>Recent activity</h3>
              </div>
              <ul id="historyList" class="activity-list"></ul>
            </div>

            <div class="card">
              <div class="card-header">
                <h3>Fraud posture</h3>
              </div>
              <div id="fraudSummary" class="fraud-box"></div>
              <ul id="fraudAlerts" class="alerts-list"></ul>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/js/app.js"></script>
  </body>
</html>
